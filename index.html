        function formatDateToYYYYMMDD(dateObjOrString) {
            if (!dateObjOrString) return "";
            try {
                if (typeof dateObjOrString === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateObjOrString.trim())) {
                    return dateObjOrString.trim();
                }
                const d = new Date(dateObjOrString);
                if (isNaN(d.getTime())) return dateObjOrString.toString().trim();
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            } catch (e) {
                return dateObjOrString ? dateObjOrString.toString().trim() : "";
            }
        }

        function previewSearchPengunjung() {
            const input = document.getElementById('searchPengunjung').value.toLowerCase().trim();
            const dropdown = document.getElementById('dropdownPengunjung');
            document.getElementById('verifikasiSeksi').classList.add('hidden');

            if (!input) { dropdown.classList.add('hidden'); return; }

            const matches = state.db.filter(d => (d.nama || "").toLowerCase().includes(input));

            if (matches.length > 0) {
                let html = '';
                matches.forEach(m => {
                    html += `
                        <div onclick="pilihAnakPengunjung('${m.id}', '${m.nama}')" class="px-5 py-4 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-b-0 transition flex justify-between items-center group">
                            <div>
                                <div class="font-bold text-gray-900 text-sm group-hover:text-indigo-600 transition">${m.nama}</div>
                                <div class="text-[11px] text-gray-500 mt-1 font-medium">${m.kelas} &bull; Juz ${m.juz}</div>
                            </div>
                            <svg class="w-5 h-5 text-gray-300 group-hover:text-indigo-600 transition transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    `;
                });
                dropdown.innerHTML = html;
                dropdown.classList.remove('hidden');
            } else {
                dropdown.innerHTML = `<div class="px-5 py-4 text-xs text-gray-500 font-medium text-center">Nama tidak ditemukan...</div>`;
                dropdown.classList.remove('hidden');
            }
        }

        function pilihAnakPengunjung(id, nama) {
            document.getElementById('dropdownPengunjung').classList.add('hidden');
            document.getElementById('searchPengunjung').value = nama;
            
            document.getElementById('idVerifikasi').value = id;
            document.getElementById('namaVerifikasiDisplay').innerHTML = `Masukkan tanggal lahir untuk membuka rekam nilai <br/><b class="text-white text-sm inline-block mt-1">${nama}</b>`;
            document.getElementById('tglLahirVerifikasi').value = '';
            document.getElementById('errorVerifikasi').classList.add('hidden');
            
            document.getElementById('verifikasiSeksi').classList.remove('hidden');
        }

        function verifikasiDanLihat() {
            const id = document.getElementById('idVerifikasi').value;
            const inputTgl = document.getElementById('tglLahirVerifikasi').value;
            const err = document.getElementById('errorVerifikasi');
            
            if(!inputTgl) {
                err.innerText = "Harap masukkan tanggal lahir!";
                err.classList.remove('hidden');
                return;
            }

            const data = state.db.find(d => d.id === id);
            if (data && formatDateToYYYYMMDD(data.tanggalLahir) === inputTgl) {
                navigate('cetak', data);
            } else {
                err.innerText = "Tanggal lahir salah!";
                err.classList.remove('hidden');
            }
        }

        // --- HALAMAN PENDAFTARAN & DATA PENDAFTAR ---
        function hitungUmur() {
            const dob = document.getElementById('inputTglLahir').value;
            if(!dob) { document.getElementById('inputUmur').value = ''; return; }
            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) { age--; }
            document.getElementById('inputUmur').value = age;
        }

        function resetFormPendaftaran() { state.currentStudent = null; navigate('pendaftaran'); }

        function simpanPendaftaran() {
            const id = document.getElementById('inputId').value;
            const nama = document.getElementById('inputNama').value.trim();
            const tglLahir = document.getElementById('inputTglLahir').value;
            
            if (!nama) return showToast('Nama wajib diisi!', 'error');
            if (!tglLahir) return showToast('Tanggal lahir wajib diisi untuk keamanan!', 'error');

            const existingData = state.db.find(d => d.id === id) || {};

            const payload = {
                id: id || '',
                nama: nama,
                kelas: document.getElementById('inputKelas').value,
                tanggal_lahir: tglLahir, // format kolom supabase
                umur: document.getElementById('inputUmur').value || null,
                cita_cita: document.getElementById('inputCitaCita').value.trim(),
                nama_ayah: document.getElementById('inputAyah').value.trim(),
                nama_ibu: document.getElementById('inputIbu').value.trim(),
                pengampu: document.getElementById('inputPengampu').value,
                juz: document.getElementById('inputJuz').value,
                tahun_ajaran: document.getElementById('inputTahunPendaftaran').value,
                semester: document.getElementById('inputSemesterPendaftaran').value,
                
                // Existing fields (if any)
                nilai: existingData.nilai || {},
                rata_rata: existingData.rataRata || 0,
                keterangan: existingData.keterangan || '',
                catatan: existingData.catatan || '',
                penguji: existingData.penguji || '',
                tanggal: existingData.tanggal || new Date().toISOString()
            };

            server.saveData(payload, 'dataPendaftar');
        }

        function updateFilterPendaftar() {
            state.filterPendaftar = {
                tahunAjaran: document.getElementById('filterTahunPendaftar').value,
                semester: document.getElementById('filterSemesterPendaftar').value
            };
            render();
        }

        function exportExcelPendaftar() {
            const { tahunAjaran, semester } = state.filterPendaftar || getCurrentPeriod();
            const filteredDb = state.db.filter(d => d.tahunAjaran === tahunAjaran && d.semester === semester);

            const ws_data = filteredDb.map((d, i) => ({
                "No": i + 1,
                "Nama Lengkap": d.nama,
                "Kelas": d.kelas,
                "Juz": d.juz,
                "Tahun Ajaran": d.tahunAjaran,
                "Semester": d.semester,
                "Tanggal Lahir": formatDateToYYYYMMDD(d.tanggalLahir),
                "Umur": d.umur,
                "Cita-Cita": d.citaCita,
                "Nama Ayah": d.namaAyah,
                "Nama Ibu": d.namaIbu,
                "Pengampu Halaqoh": d.pengampu
            }));
            
            const ws = XLSX.utils.json_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data Pendaftar");
            XLSX.writeFile(wb, `Data_Pendaftar_Sertifikasi_${tahunAjaran.replace('/','-')}_Smt${semester}.xlsx`);
        }

        function viewDataPendaftar() {
            if (state.role !== 'admin' && state.role !== 'penguji') return navigate('dashboard');

            if (!state.filterPendaftar) {
                const period = getCurrentPeriod();
                state.filterPendaftar = { tahunAjaran: period.tahunAjaran, semester: period.semester };

                            <div id="displayStatus" class="text-[10px] px-2.5 py-1 rounded font-bold ml-2 uppercase tracking-widest border ${data.keterangan === 'Lulus' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-gray-100 text-gray-500 border-gray-200'}">${data.keterangan || '-'}</div>
                        </div>
                    </div>

                    <div id="surahContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>

                    <div class="mt-8 border-t border-gray-100 pt-6">
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-2">Catatan Penguji</label>
                        <textarea id="inputCatatan" oninput="simpanDraft()" rows="3" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-gray-900 text-sm font-medium resize-none outline-none" placeholder="Tulis catatan opsional...">${data.catatan || ''}</textarea>
                    </div>

                    <div class="mt-6 flex justify-end">
                        <input type="hidden" id="inputId" value="${data.id}">
                        <button onclick="simpanPenilaian()" class="w-full sm:w-auto bg-gray-900 hover:bg-black text-white px-10 py-3.5 rounded-xl font-bold shadow-lg shadow-gray-200 transition active:scale-95 text-sm border border-gray-800 tracking-wide">
                            ${isEdit ? 'Update Nilai' : 'Simpan Nilai'}
                        </button>
                    </div>
                </div>
            `);
        }

        function generateSurahInputs() {
            const juz = document.getElementById('inputJuz').value;
            const container = document.getElementById('surahContainer');
            if(!container) return;

            document.getElementById('titleSurah').innerText = `Surat Juz ${juz}`;
            const listSurah = surahData[juz] || [];
            let html = '';
            
            const existingScores = state.currentStudent?.juz == juz ? state.currentStudent.nilai : {};

            listSurah.forEach(surah => {
                const val = existingScores[surah] !== undefined ? existingScores[surah] : '';
                html += `
                    <div class="flex items-center justify-between p-3 border border-gray-200 rounded-xl hover:border-gray-400 hover:shadow-sm transition bg-white group">
                        <label class="text-sm font-semibold text-gray-700 w-2/3 truncate group-hover:text-gray-900 transition">${surah}</label>
                        <input type="number" min="0" max="100" class="surah-input w-20 px-3 py-1.5 bg-gray-50 border border-gray-300 rounded-lg focus:bg-white focus:ring-2 focus:ring-gray-900 text-center font-bold text-gray-900 outline-none transition" data-surah="${surah}" value="${val}" oninput="hitungRataRata(); simpanDraft()" placeholder="0">
                    </div>
                `;
            });
            container.innerHTML = html;
            hitungRataRata();
        }

        function hitungRataRata() {
            const inputs = document.querySelectorAll('.surah-input');
            let total = 0; let count = 0; let hasDiBawah78 = false;

            inputs.forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val)) {
                    total += val; count++;
                    if (val < 78) hasDiBawah78 = true;
                }
            });

            const rata = inputs.length > 0 ? Math.round(total / inputs.length) : 0;
            let status = ''; let statusBg = ''; let statusText = '';

            if (rata < 80) {
                status = 'Belum Lulus'; statusBg = 'bg-red-50 border-red-200'; statusText = 'text-red-700';
            } else if (rata >= 80 && hasDiBawah78) {
                status = 'Remedial'; statusBg = 'bg-amber-50 border-amber-200'; statusText = 'text-amber-700';
            } else {
                status = 'Lulus'; statusBg = 'bg-emerald-50 border-emerald-200'; statusText = 'text-emerald-700';
            }

            const elRata = document.getElementById('displayRata');
            if(elRata) {
                elRata.innerText = rata;
                const elStatus = document.getElementById('displayStatus');
                elStatus.innerText = rata > 0 ? status : '-';
                elStatus.className = `text-[10px] px-2.5 py-1 rounded font-bold ml-2 uppercase tracking-widest border ${rata > 0 ? statusBg + ' ' + statusText : 'bg-gray-100 text-gray-500 border-gray-200'}`;
            }
            return { rata, status };
        }

        function simpanPenilaian() {
            const id = document.getElementById('inputId').value;
            if (!id) return showToast('Pilih peserta terlebih dahulu!', 'error');

            const existingData = state.db.find(d => d.id === id) || {};
            const inputs = document.querySelectorAll('.surah-input');
            let nilai = {};
            inputs.forEach(input => {
                const surah = input.getAttribute('data-surah');
                nilai[surah] = input.value === '' ? 0 : parseFloat(input.value);
            });

            const hasil = hitungRataRata();

            const payload = {
                id: id,
                nama: existingData.nama,
                kelas: existingData.kelas,
                tanggal_lahir: existingData.tanggalLahir || existingData.tanggal_lahir,
                umur: existingData.umur,
                cita_cita: existingData.citaCita || existingData.cita_cita,
                nama_ayah: existingData.namaAyah || existingData.nama_ayah,
                nama_ibu: existingData.namaIbu || existingData.nama_ibu,
                pengampu: existingData.pengampu,
                tahun_ajaran: document.getElementById('inputTahun').value,
                semester: document.getElementById('inputSemester').value,
                juz: document.getElementById('inputJuz').value,
                nilai: nilai,
                rata_rata: hasil.rata,
                keterangan: hasil.status,
                catatan: document.getElementById('inputCatatan').value.trim(),
                penguji: existingData.penguji ? existingData.penguji : (state.namaPenguji || 'Penguji'),
                tanggal: new Date().toISOString()
            };

            server.saveData(payload, 'laporan');
        }

        function simpanDraft() {
            if (state.view !== 'penilaian') return;
            const inputJuzEl = document.getElementById('inputJuz');
            if (!inputJuzEl) return;
            
            const inputs = document.querySelectorAll('.surah-input');
            let nilai = {};
            inputs.forEach(input => {
                const surah = input.getAttribute('data-surah');
                nilai[surah] = input.value === '' ? '' : parseFloat(input.value);
            });

            const draft = {
                id: document.getElementById('inputId')?.value || '',
                nama: document.getElementById('inputNama')?.value || '',
                kelas: document.getElementById('inputKelas')?.value || kelasList[0],
                tahunAjaran: document.getElementById('inputTahun')?.value || '',
                semester: document.getElementById('inputSemester')?.value || '1',
                juz: inputJuzEl.value || '30',
                catatan: document.getElementById('inputCatatan')?.value || '',
                nilai: nilai
            };
            localStorage.setItem('draftPenilaian_Arkan', JSON.stringify(draft));
        }

        function resetFormPenilaian() {
            state.currentStudent = null;
            localStorage.removeItem('draftPenilaian_Arkan');
            navigate('penilaian');
        }

        function tampilkanPreviewPencarian() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('searchDropdown');
            const resEl = document.getElementById('searchResult');
            resEl.classList.add('hidden'); 

            if (!input) { dropdown.classList.add('hidden'); return; }

            const matches = state.db.filter(d => String(d.nama || '').toLowerCase().includes(input));

            if (matches.length > 0) {
                let html = '';
                matches.forEach(m => {
                    const statusText = m.keterangan ? m.keterangan : 'Belum Dinilai';
                    const warnaStatus = statusText === 'Lulus' ? 'text-emerald-600' : statusText === 'Remedial' ? 'text-amber-600' : statusText === 'Belum Lulus' ? 'text-red-500' : 'text-gray-500';
                    html += `
                        <div onclick="pilihSiswaEdit('${m.id}')" class="px-5 py-4 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-b-0 transition">
                            <div class="font-bold text-gray-900 text-sm">${m.nama}</div>
                            <div class="text-[11px] text-gray-500 mt-1 font-medium">
                                ${m.kelas} &bull; Juz ${m.juz} &bull; <span class="${warnaStatus} font-bold">${statusText}</span>
                            </div>
                        </div>
                    `;
                });
                dropdown.innerHTML = html;
                dropdown.classList.remove('hidden');
            } else {
                dropdown.innerHTML = `<div class="px-5 py-4 text-xs text-gray-500 font-medium">Tidak menemukan peserta...</div>`;
                dropdown.classList.remove('hidden');
            }
        }

        function pilihSiswaEdit(id) {
            const found = state.db.find(d => d.id === id);
            if (found) {
                if (state.role === 'penguji' && found.penguji && found.penguji !== state.namaPenguji) {
                    showToast('Akses Ditolak: Anda tidak dapat mengedit data yang diinput oleh penguji lain.', 'error');
                    return;
                }
                document.getElementById('searchDropdown').classList.add('hidden');
                document.getElementById('searchInput').value = '';
                navigate('penilaian', found);
            }
        }

        function cariSiswa() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!q) return;
            document.getElementById('searchDropdown').classList.add('hidden');
            const found = state.db.find(d => String(d.nama || '').toLowerCase().includes(q));
            const resEl = document.getElementById('searchResult');
            if (found) {
                if (state.role === 'penguji' && found.penguji && found.penguji !== state.namaPenguji) {
                    showToast('Akses Ditolak: Anda tidak dapat mengedit data yang diinput oleh penguji lain.', 'error');
                    return;
                }
                resEl.classList.add('hidden');
                document.getElementById('searchInput').value = '';
                navigate('penilaian', found);
            } else {
                resEl.innerText = "Data tidak ditemukan. Pastikan ejaan sesuai.";
                resEl.classList.remove('hidden');
            }
        }

        // --- HALAMAN LAPORAN ---
        function updateSortLaporan(val) {
            state.sortLaporan = val;
            render();
            if(state.searchLaporan) {
                const searchEl = document.getElementById('filterNama');
                if (searchEl) { searchEl.value = state.searchLaporan; filterLaporanDOM(); }
            }
        }

        function viewLaporan() {
            if (state.role !== 'admin' && state.role !== 'penguji') return navigate('dashboard');

            let displayDb = [...state.db];
            if (state.sortLaporan === 'nama_az') displayDb.sort((a, b) => String(a.nama || '').localeCompare(String(b.nama || '')));
            else if (state.sortLaporan === 'nama_za') displayDb.sort((a, b) => String(b.nama || '').localeCompare(String(a.nama || '')));
            else if (state.sortLaporan === 'kelas') displayDb.sort((a, b) => String(a.kelas || '').localeCompare(String(b.kelas || ''), undefined, {numeric: true}));
            else if (state.sortLaporan === 'nilai_tinggi') displayDb.sort((a, b) => (b.rataRata || 0) - (a.rataRata || 0));
            else if (state.sortLaporan === 'nilai_rendah') displayDb.sort((a, b) => (a.rataRata || 0) - (b.rataRata || 0));

            let desktopTrs = '';
            let mobileCards = '';

            if(displayDb.length === 0) {
                const emptyMsg = `<div class="py-10 text-center text-gray-500 font-medium text-sm">Belum ada data nilai.</div>`;
                desktopTrs = `<tr><td colspan="7">${emptyMsg}</td></tr>`;
                mobileCards = emptyMsg;
            } else {
                displayDb.forEach((d, index) => {
                    const statusText = d.keterangan || 'Belum Dinilai';

                                          statusText === 'Remedial' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 
                                          statusText === 'Belum Lulus' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-gray-50 text-gray-600 border border-gray-200';

                    desktopTrs += `
                        <tr class="hover:bg-gray-50 border-b border-gray-100 transition">
                            <td class="px-4 py-4 text-sm text-gray-500 text-center">${index + 1}</td>
                            <td class="px-4 py-4 text-sm font-bold text-gray-900 searchable-name-desktop">${d.nama}</td>
                            <td class="px-4 py-4 text-sm text-gray-600 text-center font-medium">${d.kelas}</td>
                            <td class="px-4 py-4 text-sm font-bold text-gray-600 text-center">Juz ${d.juz}</td>
                            <td class="px-4 py-4 text-sm font-black text-center text-gray-900">${d.rataRata}</td>
                            <td class="px-4 py-4 text-sm text-center">
                                <span class="px-3 py-1.5 rounded-lg text-[10px] uppercase tracking-widest font-bold ${statusBgClass}">${statusText}</span>
                            </td>
                            <td class="px-4 py-4 text-sm text-center">
                                <div class="flex justify-center gap-2">
                                    <button onclick="bukaCetak('${d.id}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 p-2 rounded-lg transition" title="Cetak/Excel"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg></button>
                                    ${(state.role === 'admin' || (state.role === 'penguji' && (!d.penguji || d.penguji === state.namaPenguji))) ? `
                                        <button onclick="bukaEdit('${d.id}')" class="bg-gray-100 text-gray-700 hover:bg-gray-900 hover:text-white p-2 rounded-lg transition" title="Edit Nilai"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                        <button onclick="hapusData('${d.id}')" class="bg-red-50 text-red-600 hover:bg-red-100 p-2 rounded-lg transition" title="Hapus"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                    ` : ''}
                                </div>
                            </td>
                        </tr>
                    `;

                    mobileCards += `
                        <div class="mobile-card-item bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1.5 h-full ${statusText === 'Lulus' ? 'bg-emerald-500' : statusText === 'Remedial' ? 'bg-amber-500' : statusText === 'Belum Lulus' ? 'bg-red-500' : 'bg-gray-300'}"></div>
                            <div class="pl-3">
                                <div class="flex justify-between items-start mb-2">
                                    <div class="font-bold text-gray-900 text-sm searchable-name-mobile line-clamp-1 pr-2">${d.nama}</div>
                                    <span class="px-2.5 py-1 rounded-md text-[9px] uppercase tracking-widest font-bold shrink-0 ${statusBgClass}">${statusText}</span>
                                </div>
                                <div class="text-[11px] font-medium text-gray-500 mb-4">${d.kelas} &bull; Juz ${d.juz}</div>
                                
                                <div class="flex justify-between items-end border-t border-gray-100 pt-4">
                                    <div>
                                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Rata-rata</div>
                                        <div class="font-black text-xl text-gray-900 leading-none mt-1">${d.rataRata}</div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="bukaCetak('${d.id}')" class="bg-indigo-50 text-indigo-600 active:bg-indigo-100 p-2.5 rounded-xl transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg></button>
                                        ${(state.role === 'admin' || (state.role === 'penguji' && (!d.penguji || d.penguji === state.namaPenguji))) ? `
                                            <button onclick="bukaEdit('${d.id}')" class="bg-gray-100 text-gray-700 active:bg-gray-200 p-2.5 rounded-xl transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                            <button onclick="hapusData('${d.id}')" class="bg-red-50 text-red-600 active:bg-red-100 p-2.5 rounded-xl transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            return renderLayout(`
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="p-5 sm:p-6 border-b border-gray-100 bg-gray-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-3 w-full md:w-auto">
                            <h2 class="text-xl font-bold text-gray-900 tracking-tight whitespace-nowrap">Hasil Penilaian</h2>
                            <button onclick="navigate('cetakSemua')" class="w-full sm:w-auto justify-center bg-gray-900 hover:bg-black text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                                Cetak PDF
                            </button>
                        </div>
                        
                        <div class="flex flex-col sm:flex-row items-center gap-2 w-full md:w-auto">
                            <select id="sortLaporan" onchange="updateSortLaporan(this.value)" class="w-full sm:w-auto px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-gray-900 focus:border-gray-900 bg-white shadow-sm font-semibold text-gray-600 outline-none">
                                <option value="terbaru" ${state.sortLaporan === 'terbaru' ? 'selected' : ''}>Urutan Terbaru</option>
                                <option value="nama_az" ${state.sortLaporan === 'nama_az' ? 'selected' : ''}>Nama (A - Z)</option>
                                <option value="nama_za" ${state.sortLaporan === 'nama_za' ? 'selected' : ''}>Nama (Z - A)</option>
                                <option value="kelas" ${state.sortLaporan === 'kelas' ? 'selected' : ''}>Urutan Kelas</option>
                                <option value="nilai_tinggi" ${state.sortLaporan === 'nilai_tinggi' ? 'selected' : ''}>Nilai Tertinggi</option>

                                </div>
                                <input type="text" id="filterNama" value="${state.searchLaporan || ''}" placeholder="Cari nama peserta..." onkeyup="handleSearchLaporan(this.value)" class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-900 focus:border-gray-900 text-sm shadow-sm outline-none font-medium">
                            </div>
                        </div>
                    </div>
                    
                    <div class="hidden md:block overflow-x-auto">
                        <table class="w-full text-left" id="tabelLaporan">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center">No</th>
                                    <th class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest">Nama Lengkap</th>
                                    <th class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center">Kelas</th>
                                    <th class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center">Juz</th>
                                    <th class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center">Rata-rata</th>
                                    <th class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center">Status</th>
                                    <th class="px-4 py-4 text-[11px] font-bold text-gray-400 uppercase tracking-widest text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${desktopTrs}
                            </tbody>
                        </table>
                    </div>

                    <div class="md:hidden p-4 bg-gray-50 hide-scrollbar">
                        ${mobileCards}
                    </div>
                </div>
            `);
        }

        function handleSearchLaporan(val) {
            state.searchLaporan = val;
            filterLaporanDOM();
        }

        function filterLaporanDOM() {
            const filter = state.searchLaporan.toLowerCase();
            const table = document.getElementById("tabelLaporan");
            if (table) {
                const tr = table.getElementsByTagName("tr");
                for (let i = 1; i < tr.length; i++) {
                    let nameEl = tr[i].querySelector(".searchable-name-desktop");
                    if (nameEl) tr[i].style.display = nameEl.innerText.toLowerCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
            const cards = document.querySelectorAll(".mobile-card-item");
            cards.forEach(card => {
                let nameEl = card.querySelector(".searchable-name-mobile");
                if (nameEl) card.style.display = nameEl.innerText.toLowerCase().indexOf(filter) > -1 ? "" : "none";
            });
        }

        function bukaCetak(id) {
            const data = state.db.find(d => d.id === id);
            if(data) navigate('cetak', data);
        }

        function bukaEdit(id) {
            const data = state.db.find(d => d.id === id);
            if(data) {
                if (state.role === 'penguji' && data.penguji && data.penguji !== state.namaPenguji) {
                    showToast('Akses Ditolak: Anda hanya dapat mengedit data peserta yang Anda input sendiri.', 'error');
                    return;
                }
                navigate('penilaian', data);
            }
        }

        function hapusData(id) {
            const data = state.db.find(d => d.id === id);
            if (state.role === 'penguji' && data && data.penguji && data.penguji !== state.namaPenguji) {
                showToast('Akses Ditolak: Anda hanya dapat menghapus data yang Anda input sendiri.', 'error');
                return;
            }
            if(confirm('Yakin ingin menghapus data ini secara permanen?')) {
                server.deleteData(id);
            }
        }

        function exportExcelIndividu() {
            const d = state.currentStudent;
            if(!d) return;

            const listSurah = surahData[d.juz] || [];
            let ws_data = [
                ["LAPORAN HASIL SERTIFIKASI AL-QUR'AN"],
                ["Tahun Ajaran", d.tahunAjaran, "Semester", d.semester],
                ["Nama Lengkap", d.nama, "Kelas", d.kelas],
                ["Juz", d.juz, "Pengampu", d.penguji || d.pengampu || ''],
                ["Keterangan", d.keterangan || 'Belum Dinilai', "Rata-rata", d.rataRata],
                ["Catatan", d.catatan || ''],
                [],
                ["No", "Nama Surat", "Nilai"]
            ];

            listSurah.forEach((surah, index) => {
                const nilai = d.nilai[surah] !== undefined ? d.nilai[surah] : 0;
                ws_data.push([index + 1, surah, nilai]);
            });

            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Nilai Individu");
            XLSX.writeFile(wb, `Nilai_Sertifikasi_${d.nama.replace(/ /g, '_')}_Juz${d.juz}.xlsx`);
        }

        function updateFilterCetak() {
            state.filterCetak = {

            };
            render();

        function exportExcelSemua() {
            if (!state.filterCetak) {
                state.filterCetak = getCurrentPeriod();
            }

            const { tahunAjaran, semester } = state.filterCetak;
            let filteredDb = state.db.filter(d => d.tahunAjaran === tahunAjaran && d.semester === semester);

            if (state.sortLaporan === 'nama_az') filteredDb.sort((a, b) => String(a.nama || '').localeCompare(String(b.nama || '')));
            else if (state.sortLaporan === 'nama_za') filteredDb.sort((a, b) => String(b.nama || '').localeCompare(String(a.nama || '')));
            else if (state.sortLaporan === 'kelas') filteredDb.sort((a, b) => String(a.kelas || '').localeCompare(String(b.kelas || ''), undefined, {numeric: true}));
            else if (state.sortLaporan === 'nilai_tinggi') filteredDb.sort((a, b) => (b.rataRata || 0) - (a.rataRata || 0));
            else if (state.sortLaporan === 'nilai_rendah') filteredDb.sort((a, b) => (a.rataRata || 0) - (b.rataRata || 0));

            const ws_data = filteredDb.map((d, i) => ({
                "No": i + 1,
                "Nama Lengkap": d.nama,
                "Kelas": d.kelas,
                "Juz": d.juz,
                "Rata-rata": d.rataRata,
                "Keterangan": d.keterangan || 'Belum Dinilai',
                "Pengampu": d.penguji || d.pengampu || '',
                "Catatan": d.catatan || ''
            }));

            const ws = XLSX.utils.json_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap Nilai");
            XLSX.writeFile(wb, `Rekap_Nilai_Sertifikasi_${tahunAjaran.replace(/ /g, '_')}_Smt${semester}.xlsx`);
        }

            else if (state.sortLaporan === 'kelas') filteredDb.sort((a, b) => String(a.kelas || '').localeCompare(String(b.kelas || ''), undefined, {numeric: true}));
            else if (state.sortLaporan === 'nilai_tinggi') filteredDb.sort((a, b) => (b.rataRata || 0) - (a.rataRata || 0));
            else if (state.sortLaporan === 'nilai_rendah') filteredDb.sort((a, b) => (a.rataRata || 0) - (b.rataRata || 0));

                        <div class="pt-4 flex gap-3 justify-end">
                            <button onclick="navigate('dashboard')" class="px-4 sm:px-5 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl text-sm font-bold hover:bg-gray-50 transition w-1/3 sm:w-auto text-center">Batal</button>
                            <button id="btnUpdateProfil" onclick="submitProfil()" class="px-5 sm:px-6 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-emerald-700 transition w-2/3 sm:w-auto text-center">Simpan Perubahan</button>
                        </div>
                    </div>
                </div>
            `);
        }

        function submitProfil() {
            const oldPass = document.getElementById('profilOldPass').value.trim();
            const newPass = document.getElementById('profilNewPass').value.trim();
            const newNama = document.getElementById('profilNama').value.trim();
            const err = document.getElementById('profilError');

            if(!oldPass) {
                err.innerText = "Password Lama wajib diisi untuk verifikasi keamanan!";
                err.classList.remove('hidden');
                return;
            }
            if(!newNama) {
                err.innerText = "Nama tampilan tidak boleh kosong!";
                err.classList.remove('hidden');
                return;
            }

            server.updateProfil(oldPass, newPass, newNama);
        }

        function render() {
            let html = '';
            if (state.role === 'pengunjung' && state.view !== 'login' && state.view !== 'cetak') {
                html = viewDashboardPengunjung();
            } else {
                switch (state.view) {
                    case 'login': html = viewLogin(); break;
                    case 'dashboard': html = viewDashboard(); break;
                    case 'pendaftaran': html = viewPendaftaran(); break;
                    case 'dataPendaftar': html = viewDataPendaftar(); break;
                    case 'penilaian': html = viewPenilaian(); break;
                    case 'laporan': html = viewLaporan(); break;
                    case 'cetak': html = viewCetak(); break;
                    case 'cetakSemua': html = viewCetakSemua(); break;
                    case 'profil': html = viewProfil(); break;
                    default: html = viewLogin();
                }
            }
            app.innerHTML = html;

            if (state.view === 'penilaian') generateSurahInputs();
            if (state.view === 'dashboard' && state.role !== 'pengunjung') initDashboardChart();
            if (state.view === 'laporan' && state.searchLaporan) filterLaporanDOM();
        }

        function initDashboardChart() {
            const ctx = document.getElementById('kelulusanChart');
            if (!ctx) return;

            const period = getCurrentPeriod();
            const currentDb = state.db.filter(d => d.tahunAjaran === period.tahunAjaran && d.semester === period.semester);
            const lulus = currentDb.filter(d => d.keterangan === 'Lulus').length;
            const remedial = currentDb.filter(d => d.keterangan === 'Remedial').length;
            const belumLulus = currentDb.filter(d => d.keterangan === 'Belum Lulus').length;

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Lulus', 'Remedial', 'Belum Lulus'],
                    datasets: [{
                        data: [lulus, remedial, belumLulus],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%', 
                    plugins: {
                        legend: { display: false }, 
                        tooltip: { bodyFont: { family: 'Inter' } }
                    }
                }
            });
        }

        server.init();
    </script>
</body>
</html>
